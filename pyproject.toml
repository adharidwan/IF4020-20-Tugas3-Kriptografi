[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anticnspy"
version = "1.0.0"
description = "Strict, package-scoped software release signing and verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "PyYAML>=6,<7"]

[project.scripts]
anticnspy = "anticnspy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
